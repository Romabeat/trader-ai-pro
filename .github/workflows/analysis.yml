name: Trader AI Pro - Analyse programmee

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: trader-ai-pro-analysis
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DRY_RUN: "true"
      ENABLE_TELEGRAM_ALERTS: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Verifier la syntaxe Python
        run: |
          python -m py_compile analysis_engine.py strategy.py deriv_market.py scheduled_analysis.py app.py test_compatibility.py trade_journal.py

      - name: Lancer les tests de compatibilite
        run: |
          python -m unittest test_compatibility -v

      - name: Executer l'analyse programmee
        run: |
          python -u scheduled_analysis.py
