name: Trader AI Pro - Analyse programmee

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: trader-ai-pro-analysis
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DRY_RUN: 'true'
      ENABLE_TELEGRAM_ALERTS: 'false'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verifier la syntaxe Python
        run: |
          python -m py_compile analysis_engine.py strategy.py deriv_market.py scheduled_analysis.py app.py test_compatibility.py trade_journal.py

      - name: Lancer les tests de compatibilite
        run: |
          python -m unittest test_compatibility -v

      - name: Executer l'analyse programmee
        if: success()
        run: |
          python -u scheduled_analysis.py

## 2. Enregistre le fichier

Sur GitHub :

1. Descends en bas de la page.
2. Appuie sur **Commit changes**.
3. Confirme l’enregistrement si GitHub le demande.

## 3. Relance le workflow

1. Ouvre l’onglet **Actions**.
2. Sélectionne **Trader AI Pro - Analyse programmee**.
3. Appuie sur **Run workflow**.
4. Confirme le lancement.

### ⚠️ Deux précautions importantes

- J’ai désactivé temporairement les alertes Telegram avec `ENABLE_TELEGRAM_ALERTS: 'false'`. Nous les réactiverons après les vérifications.
- Le workflow s’arrêtera si un fichier Python attendu est absent ou si les tests échouent. C’est volontaire : il faut corriger ces problèmes avant d’aller plus loin.

Cette version utilise la syntaxe standard documentée par [GitHub Actions](https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax?utm_source=chatgpt.com). Elle n’a toutefois pas encore été exécutée sur ton dépôt.

**Après le lancement, envoie-moi le résultat : vert ✅ ou rouge ❌, avec le message affiché.** Nous corrigerons la prochaine erreur éventuelle sans modifier inutilement les autres fichiers.
